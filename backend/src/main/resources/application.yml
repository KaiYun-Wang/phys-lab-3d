server:
  port: ${phys-lab.server.port}

spring:
  application:
    name: backend
  profiles:
    # 演示分支默认走 demo profile（连接配置见 application-demo.yml，已 gitignore）
    active: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: ${phys-lab.datasource.driver-class-name}
    url: jdbc:postgresql://${phys-lab.datasource.host}:${phys-lab.datasource.port}/${phys-lab.datasource.database}
    username: ${phys-lab.datasource.username}
    password: ${phys-lab.datasource.password}
  data:
    redis:
      host: ${phys-lab.redis.host:localhost}
      port: ${phys-lab.redis.port:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# SQL 走 SLF4J；默认不打 SQL。本地要看时在 application-local.yml 开 mapper DEBUG
logging:
  level:
    root: info
    com.wky.backend: info

phys-lab:
  jwt:
    secret: phys-lab-3d
    expiration-ms: 86400000
  # 只读体验模式（演示版本）：非 GET 请求统一拒绝（见 security/ReadOnlyModeFilter），
  # 写路径不落库。演示分支默认开启；如需临时绕过，在 application-demo.yml 覆写为 false。
  readonly:
    enabled: true
    message: 体验环境仅支持查询操作
  ai:
    # 对话模型（OpenAI 兼容）
    chat:
      api-key: ${PHYS_LAB_AI_CHAT_API_KEY:}
      base-url: ${PHYS_LAB_AI_CHAT_BASE_URL:https://api.deepseek.com}
      model: ${PHYS_LAB_AI_CHAT_MODEL:deepseek-chat}
    # 仅统计 user/assistant。入模至少条数；不足则从摘要截止点往前补；摘要时也保留最近这么多条不压缩
    history-min: 10
    # 未摘要对话条数大于等于此值 -> 投递异步摘要任务
    summary-soft-limit: 30
    # 未摘要对话条数大于此值 -> 助手回复繁忙文案（仍会尝试投递摘要）
    summary-hard-limit: 50
    tts:
      enabled: ${PHYS_LAB_AI_TTS_ENABLED:false}
      api-key: ${PHYS_LAB_AI_TTS_API_KEY:}
      base-url: ${PHYS_LAB_AI_TTS_BASE_URL}
      model: ${PHYS_LAB_AI_TTS_MODEL}
      voice: ${PHYS_LAB_AI_TTS_VOICE}

dromara:
  x-file-storage:
    default-platform: minio-1
    minio:
      - platform: minio-1
        enable-storage: true
        access-key: ${phys-lab.minio.access-key}
        secret-key: ${phys-lab.minio.secret-key}
        end-point: ${phys-lab.minio.endpoint}
        bucket-name: ${phys-lab.minio.bucket}
        # 仅占位；业务入库用相对路径 /api/avatars|covers|demos/...
        domain: ${phys-lab.minio.domain:/api/}
        base-path: avatars/
      - platform: minio-covers
        enable-storage: true
        access-key: ${phys-lab.minio.access-key}
        secret-key: ${phys-lab.minio.secret-key}
        end-point: ${phys-lab.minio.endpoint}
        bucket-name: ${phys-lab.minio.bucket}
        domain: ${phys-lab.minio.domain:/api/}
        base-path: covers/
      - platform: minio-demos
        enable-storage: true
        access-key: ${phys-lab.minio.access-key}
        secret-key: ${phys-lab.minio.secret-key}
        end-point: ${phys-lab.minio.endpoint}
        bucket-name: ${phys-lab.minio.bucket}
        domain: ${phys-lab.minio.domain:/api/}
        base-path: demos/
