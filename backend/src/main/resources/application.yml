server:
  port: ${phys-lab.server.port}

spring:
  application:
    name: backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: ${phys-lab.datasource.driver-class-name}
    url: jdbc:postgresql://${phys-lab.datasource.host}:${phys-lab.datasource.port}/${phys-lab.datasource.database}
    username: ${phys-lab.datasource.username}
    password: ${phys-lab.datasource.password}
  data:
    redis:
      host: ${phys-lab.redis.host:localhost}
      port: ${phys-lab.redis.port:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${phys-lab.mybatis.log-impl}
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

phys-lab:
  jwt:
    secret: phys-lab-3d
    expiration-ms: 86400000
  ai:
    # 对话模型（OpenAI 兼容）
    chat:
      api-key: ${PHYS_LAB_AI_CHAT_API_KEY:}
      base-url: ${PHYS_LAB_AI_CHAT_BASE_URL:https://api.deepseek.com}
      model: ${PHYS_LAB_AI_CHAT_MODEL:deepseek-chat}
    # 仅统计 user/assistant。入模至少条数；不足则从摘要截止点往前补；摘要时也保留最近这么多条不压缩
    history-min: 10
    # 未摘要对话条数大于等于此值 -> 投递异步摘要任务
    summary-soft-limit: 30
    # 未摘要对话条数大于此值 -> 助手回复繁忙文案（仍会尝试投递摘要）
    summary-hard-limit: 50
    # 摘要会话锁 TTL（秒），防 Worker 挂死占锁
    summary-lock-ttl-seconds: 120
    # Redis Streams 积压上限，满则助手回复繁忙
    summary-queue-max: 100

dromara:
  x-file-storage:
    default-platform: minio-1
    minio:
      - platform: minio-1
        enable-storage: true
        access-key: ${phys-lab.minio.access-key}
        secret-key: ${phys-lab.minio.secret-key}
        end-point: ${phys-lab.minio.endpoint}
        bucket-name: ${phys-lab.minio.bucket}
        domain: ${phys-lab.minio.domain}
        base-path: avatars/
      - platform: minio-covers
        enable-storage: true
        access-key: ${phys-lab.minio.access-key}
        secret-key: ${phys-lab.minio.secret-key}
        end-point: ${phys-lab.minio.endpoint}
        bucket-name: ${phys-lab.minio.bucket}
        domain: ${phys-lab.minio.domain}
        base-path: covers/
