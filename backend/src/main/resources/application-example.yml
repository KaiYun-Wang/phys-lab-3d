# 复制为本目录下的 application-local.yml 后按需修改：
#   copy application-example.yml application-local.yml
# application-local.yml 含密钥，已 gitignore，勿提交到仓库。

# 开发需要看 SQL 时打开；关掉则控制台不再刷 SQL
logging:
  level:
    com.wky.backend.mapper: debug

phys-lab:
  server:
    port: 8080
  datasource:
    driver-class-name: org.postgresql.Driver
    host: localhost
    port: 5432
    database: phys_lab_3d
    username: postgres
    password: postgres
  minio:
    access-key: minioadmin
    secret-key: minioadmin
    # 仅后端 SDK 连 MinIO（浏览器不直连）
    endpoint: http://127.0.0.1:9000
    bucket: phys-lab
    # x-file-storage 占位；入库一律相对路径 /api/avatars|covers|demos/...
    domain: /api/

  redis:
    host: localhost
    port: 6379

  # ---------- AI（LangChain4j OpenAI 兼容协议）----------
  # base-url 须为 OpenAI 兼容接口（.../v1/chat/completions）。
  # DeepSeek、硅基流动、多数国内中转可用；原生 Anthropic / Gemini 专用 API 暂不支持。
  ai:
    chat:
      api-key: sk-your-chat-api-key
      # 推荐 DeepSeek 官方（OpenAI 兼容，不要多写 /v1 后缀也可，客户端会拼路径）
      #   https://api.deepseek.com
      # 其它中转一般形如：
      #   https://xxx.example.com/v1
      base-url: https://api.deepseek.com
      # 推荐：deepseek-chat（通用）；需要思考过程可用 deepseek-reasoner / deepseek-v4-pro 等推理型号
      model: deepseek-chat
    # ----- 会话上下文（只数 user/assistant）-----
    # 入模至少条数；摘要后不足则从截止点往前补；摘要任务也留最近这么多条不压缩
    history-min: 10
    # 大于等于此条数 -> 异步生成摘要
    summary-soft-limit: 30
    # 大于此条数 -> 助手回复「系统繁忙，请稍后重试」（仍会尝试投递摘要）
    summary-hard-limit: 50
    # ----- TTS（演示讲解预生成；OpenAI 兼容 /audio/speech）-----
    tts:
      enabled: false
      api-key: sk-your-tts-api-key
      base-url: https://api.siliconflow.cn/v1/audio/speech
      model: fnlp/MOSS-TTSD-v0.5
      voice: fnlp/MOSS-TTSD-v0.5:anna
