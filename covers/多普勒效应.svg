<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="多普勒效应示意图">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="rgba(148,163,184,.10)" strokeWidth="1"/>
    </pattern>
    <radialGradient id="srcGlow">
      <stop offset="0" stop-color="rgba(251,191,36,.9)"/>
      <stop offset="45%" stop-color="rgba(251,191,36,.35)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="rgba(6,10,20,0)"/>
      <stop offset="100%" stop-color="rgba(6,10,20,.9)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="#070b14"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- 运动轨迹 -->
  <line x1="150" y1="200" x2="390" y2="200" stroke="rgba(148,163,184,.4)" strokeWidth="1" strokeDasharray="5 6"/>

  <!-- 波前：前进方向压缩（蓝）/ 后方膨胀（红玫） -->
  <g fill="none" strokeWidth="1.8">
    <path d="M150 30 A170 170 0 0 1 150 370" stroke="#60a5fa" opacity=".4"/>
    <path d="M150 370 A170 170 0 0 1 150 30" stroke="#f87171" opacity=".4"/>
    <path d="M198 58 A142 142 0 0 1 198 342" stroke="#60a5fa" opacity=".46"/>
    <path d="M198 342 A142 142 0 0 1 198 58" stroke="#f87171" opacity=".46"/>
    <path d="M246 86 A114 114 0 0 1 246 314" stroke="#60a5fa" opacity=".52"/>
    <path d="M246 314 A114 114 0 0 1 246 86" stroke="#f87171" opacity=".52"/>
    <path d="M294 114 A86 86 0 0 1 294 286" stroke="#60a5fa" opacity=".58"/>
    <path d="M294 286 A86 86 0 0 1 294 114" stroke="#f87171" opacity=".58"/>
    <path d="M342 142 A58 58 0 0 1 342 258" stroke="#60a5fa" opacity=".66"/>
    <path d="M342 258 A58 58 0 0 1 342 142" stroke="#f87171" opacity=".66"/>
    <path d="M390 170 A30 30 0 0 1 390 230" stroke="#60a5fa" opacity=".75"/>
    <path d="M390 230 A30 30 0 0 1 390 170" stroke="#f87171" opacity=".75"/>
  </g>

  <!-- 声源（向右运动） -->
  <circle cx="390" cy="200" r="26" fill="url(#srcGlow)"/>
  <circle cx="390" cy="200" r="8" fill="#fbbf24"/>
  <path d="M404 200 h36 m-9 -5 l9 5 -9 5" fill="none" stroke="#fbbf24" strokeWidth="2"/>

  <!-- 波前移动方向小提示：外侧弧的箭头 -->
  <path d="M596 200 m-6 -6 l14 6 -14 6" fill="none" stroke="rgba(96,165,250,.7)" strokeWidth="1.6"/>
  <path d="M80 200 m6 -6 l-14 6 14 6" fill="none" stroke="rgba(248,113,113,.7)" strokeWidth="1.6"/>

  <rect width="800" height="400" fill="url(#fade)"/>
</svg>
