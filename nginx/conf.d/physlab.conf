# PhysLab 3D 路由（上游 = 本机回环端口：39001 用户端 / 39002 管理端 / 39003 后端）
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 12m;
    limit_conn addr 50;

    # 后端 API（含 AI 聊天 SSE 流式：禁缓冲 + 拉长超时）
    location /api/ {
        limit_req zone=api burst=60 delay=40;
        proxy_pass http://127.0.0.1:39003;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin {
        limit_req zone=page burst=60 delay=40;
        proxy_pass http://127.0.0.1:39002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=page burst=60 delay=40;
        proxy_pass http://127.0.0.1:39001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
